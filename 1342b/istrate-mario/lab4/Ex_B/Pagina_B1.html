<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
    background-color: #ffffcc;
    }
.center {
  text-align: center;
  color: white;
}
    h1 {
        background-color: #00cc66;
        color: orange;
    }
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
.centre {
border: 5px solid blue;
 padding: 15px;
 
}
.centrecelula{
  border:5px;
  padding:15px;
}
#s1 {
background-color: green;
}
#s2 {
background-color: yellow;
}
div {
color:blue;
}
.tabel1{
  background-color:blue
}
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>
<div id="s1">
<table style="width:100%" class="center" >
  <tr class="tabel1">
    <th >Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr class="tabel1">
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr class="tabel1">
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 
<div id="s2" style="width:100%">
<br>
<table style="width:100%" class="centre" class="tabel1">
  <tr>
    <th class="centre">Firstname</th>
    <th class="centre">Lastname</th>
    <th class="centre">Age</th>
  </tr>
  <tr >
    <td class="centrecelula">Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td class="centrecelula">Jackson</td>
    <td>94</td>
  </tr>
</table>
</div> 


</body>
</html>

<!-- cele doua tabele au culori diferite deoarece primului div i se atribuie id ul care schimba culoarea in verde, iar la al doilea div culoarea galben -->
 <!-- celulele din al doilea tabel sunt diferite pentru ca se atribuie prin clasa center unor td uri si th uri un alt padding si border -->
