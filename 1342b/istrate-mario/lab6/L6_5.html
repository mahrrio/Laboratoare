<!doctype html>
<html>
  <head>
    <title>Modificare folosind clase si evenimente</title>
  </head>
  <body>
    <h3>
      Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa
      cum este indicat in textele de deasupra lor
    </h3>
    La click vor aparea Pisici
    <hr />
    <img
      class="animal"
      src="Img/Pesti.jpg"
      alt="Niste pesti"
      width="160"
      height="120"
    />
    <br />
    <br />
    La mouseover vor aparea Munti
    <hr />
    <img
      class="peisaj"
      src="Img/desert.jpg"
      alt="O jungla"
      width="160"
      height="120"
    />
    <br />
    <br />
    La click vor aparea Caini
    <hr />
    <img
      class="animal"
      src="Img/egrete.jpg"
      alt="Niste egrete"
      width="160"
      height="120"
    />
    <br />
    <br />
    la mouseout va aparea o Mare
    <hr />
    <img
      class="peisaj"
      src="Img/jungla.jpg"
      alt="Un desert"
      width="160"
      height="120"
    />

    <script>
      var animale = document.getElementsByClassName("animal");
      var peisaje = document.getElementsByClassName("peisaj");

      if (animale.length >= 1) {
        animale[0].addEventListener("click", function () {
          this.src = "Img/pisici.jpg";
        });
      }

      if (peisaje.length >= 1) {
        peisaje[0].addEventListener("mouseover", function () {
          this.src = "Img/munti.jpg";
        });
      }

      if (animale.length >= 2) {
        animale[1].addEventListener("click", function () {
          this.src = "Img/caini.jpg";
        });
      }

      if (peisaje.length >= 2) {
        peisaje[1].addEventListener("mouseout", function () {
          this.src = "Img/mare.jpg";
        });
      }
    </script>
  </body>
</html>
