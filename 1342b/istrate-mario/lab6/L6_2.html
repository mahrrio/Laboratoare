<!doctype html>
<html>
  <head>
    <title>Acest titlu va fi modificat cu JS</title>
  </head>
  <body>
    <p>
      Salutare, <br />
      oameni buni! <br />
      (De modificat culoarea de background cu js!)
    </p>

    <p>
      Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile
      indicate in paragrafele alaturate, <br />
      precum si titlul paginii !
    </p>

    <p>
      Acest text va fi colorat <br />folosind <br />
      JavaScript
    </p>
    <script>
      document.title = "titlul nou";
      var paragrafe = document.getElementsByTagName("p");
      if (paragrafe.length > 0) {
        paragrafe[0].style.backgroundColor = "yellow";
      }
      if (paragrafe.length > 1) {
        paragrafe[1].style.color = "aquamarine";
      }
    </script>
  </body>
</html>
